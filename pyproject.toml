[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "backup-tool"
version = "0.2.0"
description = "Cross-platform CLI engine for automated file backup & restoration to SMB/NFS network shares"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
keywords = ["backup", "smb", "nfs", "network", "cli"]
authors = [
    {name = "Batu1-1an"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Networking",
]

dependencies = [
    "PyYAML>=6.0",
    "schedule>=1.2",
]

[project.urls]
Homepage = "https://github.com/Batu1-1an/Backup-tool"
Repository = "https://github.com/Batu1-1an/Backup-tool.git"
BugTracker = "https://github.com/Batu1-1an/Backup-tool/issues"

[project.scripts]
backup_tool = "backup_tool.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
